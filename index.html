<style>
/* Layout: one-column phone app, bottom tab bar, content cards set like a study notebook; English always in Lexend, LTR */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#16302B; --muted:#5B6E69; --line:#D3DDD9;
  --teal:#1F6F63; --teal-soft:#DCEBE7; --sun:#E8A317; --sun-soft:#FBEFD2;
  --good:#2E8B57; --bad:#C0392B; --bad-soft:#F7DEDA;
  --f-ar:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-en:"Lexend","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A18; --surface:#172623; --ink:#E4EEEB; --muted:#93A8A2; --line:#2A3E3A;
  --teal:#5CC2B0; --teal-soft:#1D3B36; --sun:#F2B940; --sun-soft:#3A3018;
  --good:#5BC489; --bad:#E5756A; --bad-soft:#3E2422; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A18; --surface:#172623; --ink:#E4EEEB; --muted:#93A8A2; --line:#2A3E3A;
  --teal:#5CC2B0; --teal-soft:#1D3B36; --sun:#F2B940; --sun-soft:#3A3018;
  --good:#5BC489; --bad:#E5756A; --bad-soft:#3E2422; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.6}
*{box-sizing:border-box}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate;text-align:left}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.eyebrow{font-size:.78rem;color:var(--teal);font-weight:700;letter-spacing:.02em}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lvl-pill{font-family:var(--f-en);font-weight:600;background:var(--teal);color:var(--bg);border-radius:999px;padding:4px 12px;font-size:.9rem;border:0;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--teal-soft);border:0}
.btn{font:inherit;font-weight:600;border-radius:12px;padding:12px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:48px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2A1E00}
.btn:focus-visible,.tab:focus-visible,.opt:focus-visible,.lvl-pill:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:right;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile b{font-size:1.05rem}
.tile .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:auto}
.tile .bar i{display:block;height:100%;background:var(--teal)}
.speak{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--sun-soft);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.speak svg{width:22px;height:22px}
.phrase{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.phrase .en{font-size:1.08rem;font-weight:500}
.chk{font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer;align-self:flex-start;min-height:32px}
.chk.on{background:var(--good);border-color:var(--good);color:var(--bg)}
.opt{font:inherit;text-align:left;direction:ltr;font-family:var(--f-en);background:var(--surface);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sun);transition:width .3s}
.flash{min-height:180px;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.flash .big{font-family:var(--f-en);font-size:1.6rem;font-weight:600;direction:ltr}
.passage{font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.05rem;line-height:1.8}
.passage span.w{cursor:pointer;border-bottom:1px dotted var(--muted)}
textarea{font-family:var(--f-en);direction:ltr;font-size:1rem;width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);resize:vertical}
input[type=text]{font-family:var(--f-en);direction:ltr;font-size:1rem;flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink)}
.feedback{background:var(--sun-soft);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:.95rem}
.bubble{max-width:85%;padding:10px 14px;border-radius:14px;font-family:var(--f-en);direction:ltr;text-align:left}
.bubble.bot{background:var(--teal-soft);align-self:flex-end;border-end-end-radius:4px}
.bubble.me{background:var(--sun-soft);align-self:flex-start;border-end-start-radius:4px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto}
.back{font:inherit;background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:8px 0;align-self:flex-start}
nav.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
.tab{font:inherit;font-size:.78rem;flex:1;max-width:140px;background:none;border:0;color:var(--muted);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--teal);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:9;max-width:90%}
.steps{display:flex;gap:8px}
.steps span{flex:1;text-align:center;font-size:.8rem;padding:6px;border-radius:8px;background:var(--bg);color:var(--muted)}
.steps span.on{background:var(--teal);color:var(--bg);font-weight:700}
.result-num{font-family:var(--f-en);font-size:3rem;font-weight:600;color:var(--teal);line-height:1}
select{font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.wd{font-family:var(--f-en);padding:1px 4px;border-radius:4px}
.wd.ok{background:color-mix(in srgb,var(--good) 22%,transparent)}
.wd.miss{background:var(--bad-soft);text-decoration:underline wavy var(--bad)}
.btn.mic{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn.mic.live{animation:pulse 1s infinite}
input[type=time]{font-family:var(--f-en);font-size:1.1rem;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.nudge{background:var(--sun-soft);border:1px solid var(--sun)}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 try{if(!("speechSynthesis" in window))throw 0;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/…/g,""));u.lang=C().ttsLang;u.rate=rate;if(voice)u.voice=voice;speechSynthesis.speak(u)}
 catch(e){toast("النطق الصوتي غير متاح في هذا المتصفح")}
}

/* ============ التعرف على الصوت ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recLive=false,heard=null;
const norm=t=>t.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
function listen(onText){
 if(!SR){toast("التعرف على الصوت غير مدعوم هنا. جرّب Chrome أو Safari");return}
 if(recLive){try{rec.stop()}catch(e){}return}
 try{speechSynthesis.cancel()}catch(e){}
 rec=new SR();rec.lang=C().ttsLang;rec.interimResults=false;rec.maxAlternatives=3;
 rec.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);onText(alts)};
 rec.onerror=e=>{toast(e.error==="not-allowed"?"اسمح للمتصفح باستخدام المايك من الإعدادات":e.error==="no-speech"?"ما سمعت شي، حاول مرة ثانية":"تعذر سماعك، حاول مرة ثانية")};
 rec.onend=()=>{recLive=false;render()};
 try{rec.start();recLive=true;render()}catch(e){toast("تعذر تشغيل المايك")}
}
function scoreSpeech(target,alts){
 const want=norm(target);let best=null;
 alts.forEach(a=>{const got=norm(a);const pool=[...got];const marks=want.map(w=>{const i=pool.indexOf(w);if(i>-1){pool.splice(i,1);return 1}return 0});const sc=Math.round(marks.reduce((x,y)=>x+y,0)/want.length*100);if(!best||sc>best.score)best={score:sc,marks,said:a}});
 return best;
}
function heardView(target){
 if(!heard||heard.target!==target)return "";
 const words=target.split(/\s+/);const w=norm(target);let k=0;
 const html=words.map(raw=>{const n=norm(raw);if(!n.length)return esc(raw);const ok=heard.r.marks[k++];return `<span class="wd ${ok?"ok":"miss"}">${esc(raw)}</span>`}).join(" ");
 const msg=heard.r.score>=90?"ممتاز! نطقك واضح":heard.r.score>=60?"حلو، ركز على الكلمات المظللة بالأحمر":"قريب، اسمعها ببطء وجرب مرة ثانية";
 return `<div class="feedback" style="background:var(--teal-soft)"><b>${heard.r.score}%</b> · ${msg}<div class="en" style="margin-top:6px;line-height:2">${html}</div><div class="muted en">I heard: “${esc(heard.r.said)}”</div></div>`;
}

}

/* ============ الاختبار ============ */
let tIdx=0,tAns=[],tPicked=null;
function testView(){
 const T=C().test;
 if(tIdx>=T.length){
  const score=tAns.filter(Boolean).length;
  const per=LEVELS.map(lv=>T.map((q,i)=>q[0]===lv&&tAns[i]).filter(Boolean).length);
  let lv="A1";for(let i=0;i<LEVELS.length;i++){if(per[i]>=3)lv=LEVELS[i];else break}
  if(lv==="A1"&&score>=6)lv="A2";
  testView.result=lv;
  return `<section class="card hero" style="text-align:center;align-items:center"><div class="eyebrow">نتيجتك</div><div class="result-num">${lv}</div><h2>${C().levels[lv].title}</h2><p>أجبت ${score} من ${T.length} صح.</p><p class="muted">${C().levels[lv].desc}</p></section>
  <section class="card"><h3>التفصيل حسب المستوى</h3>${LEVELS.map((l,i)=>`<div class="row" style="justify-content:space-between"><span class="en">${l}</span><span>${per[i]} / 4</span></div>`).join("")}</section>
  <button class="btn primary" id="tDone">ابدأ التعلم من ${lv}</button>
  <label class="muted" for="lvSel">أو اختر مستوى بنفسك:</label><select id="lvSel">${LEVELS.map(l=>`<option ${l===lv?"selected":""}>${l}</option>`).join("")}</select>`;
 }
 const q=T[tIdx];
 return `<header class="top"><div><div class="eyebrow">اختبار تحديد المستوى</div><h1>سؤال ${tIdx+1} من ${T.length}</h1></div><button class="back" id="tExit">خروج</button></header>
 <div class="prog"><i style="width:${tIdx/T.length*100}%"></i></div>
 <section class="card"><p class="muted">اختر الإجابة الصحيحة. إذا ما تعرف، اختر "ما أعرف" بدل التخمين.</p>
 <p class="en" style="font-size:1.25rem;font-weight:500">${esc(q[1])}</p>
 ${q[2].map((o,j)=>`<button class="opt ${tPicked!==null?(j===q[3]?"right":j===tPicked?"wrong":""):""}" data-t="${j}" ${tPicked!==null?"disabled":""}>${esc(o)}</button>`).join("")}
 <button class="btn" data-t="-1" ${tPicked!==null?"disabled":""}>ما أعرف</button>
 ${tPicked!==null?`<button class="btn primary" id="tNext">${tIdx+1<T.length?"التالي":"شوف النتيجة"}</button>`:""}</section>`;
}
function bindTest(){
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const j=+b.dataset.t;tPicked=j;tAns[tIdx]=j===C().test[tIdx][3];if(j===-1){tIdx++;tPicked=null}render()});
 $("#tNext")&&($("#tNext").onclick=()=>{tIdx++;tPicked=null;render();scrollTo(0,0)});
 $("#tExit")&&($("#tExit").onclick=()=>{view="home";render()});
 $("#tDone")&&($("#tDone").onclick=()=>{S.level=$("#lvSel").value||testView.result;save();touchDay();view="home";render();scrollTo(0,0)});
}

/* ============ الربط ============ */
function bind(){
 document.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.dataset.say)});
 document.querySelectorAll("[data-sayslow]").forEach(b=>b.onclick=()=>say(b.dataset.sayslow,.65));
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{view=b.dataset.go;sub=b.dataset.sub||null;render();scrollTo(0,0)});
 document.querySelectorAll("[data-sub]:not([data-go])").forEach(b=>b.onclick=()=>{sub=b.dataset.sub||null;if(sub==="cards"){cardDeck=[];cardIdx=0;cardFlip=false}if(sub==="chat"&&!chatLog.length&&sampleFn){render();chatTurn(null);return}render();scrollTo(0,0)});
 document.querySelectorAll("[data-known]").forEach(b=>b.onclick=()=>{const id=b.dataset.known;if(S.known[id])delete S.known[id];else S.known[id]=1;touchDay();save();render()});
 document.querySelectorAll("[data-rq]").forEach(b=>b.onclick=()=>{const q=L().reading.qs[+b.dataset.rq];const ok=+b.dataset.ro===q[2];b.classList.add(ok?"right":"wrong");toast(ok?"صح، ممتاز":"حاول مرة ثانية");if(ok)touchDay()});
 $("#startTest")&&($("#startTest").onclick=()=>{tIdx=0;tAns=[];tPicked=null;view="test";render();scrollTo(0,0)});
 $("#chgLvl")&&($("#chgLvl").onclick=()=>{const i=(LEVELS.indexOf(S.level)+1)%LEVELS.length;S.level=LEVELS[i];save();chatLog=[];wFeedback="";toast("المستوى الآن "+S.level);render()});
 $("#nextLvl")&&($("#nextLvl").onclick=()=>{S.level=LEVELS[LEVELS.indexOf(S.level)+1];save();toast("مبروك! انتقلت إلى "+S.level);render()});
 $("#flash")&&($("#flash").onclick=()=>{cardFlip=!cardFlip;render()});
 $("#nextCard")&&($("#nextCard").onclick=()=>{cardIdx++;cardFlip=false;render()});
 $("#shNext")&&($("#shNext").onclick=()=>{shStep++;render()});
 $("#shHard")&&($("#shHard").onclick=()=>{shStep=0;render()});
 $("#shEasy")&&($("#shEasy").onclick=()=>{shStep=0;shIdx++;heard=null;touchDay();toast("أحسنت!");render()});
 $("#chatForm")&&($("#chatForm").onsubmit=e=>{e.preventDefault();const v=$("#chatIn").value.trim();if(v)chatTurn(v)});
 $("#chatReset")&&($("#chatReset").onclick=()=>{chatLog=[];chatTurn(null)});
 $("#shMic")&&($("#shMic").onclick=()=>{const p=L().phrases[shIdx%L().phrases.length][0];listen(alts=>{heard={target:p,r:scoreSpeech(p,alts)};if(heard.r.score>=90)touchDay()})});
 $("#chatMic")&&($("#chatMic").onclick=()=>listen(alts=>{const i=$("#chatIn");if(i){i.value=alts[0];}chatTurn(alts[0])}));
 $("#remT")&&($("#remT").onchange=e=>{S.remind=e.target.value||"20:00";save();render();toast("الموعد صار "+S.remind+"، أضفه للتقويم من جديد")});
 $("#icsBtn")&&($("#icsBtn").onclick=icsFile);
 $("#wText")&&($("#wText").oninput=e=>wDraft=e.target.value);
 $("#wCheck")&&($("#wCheck").onclick=checkWriting);
 $("#wNext")&&($("#wNext").onclick=()=>{wIdx++;wFeedback="";wDraft="";render()});
}
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>

document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest('[data-go="speak"],#startTest');if(!b||!window.REF)return;try{if(localStorage.getItem("darbi.started"))return;localStorage.setItem("darbi.started","1")}catch(x){}REF.signup()});</script>
